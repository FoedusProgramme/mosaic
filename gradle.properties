GROUP=org.unitedsoftware.mosaic
VERSION_NAME=0.21.0-SNAPSHOT

mavenCentralPublishing=true
# Releases are uploaded to the Central Portal and published by hand, see RELEASING.md.
mavenCentralAutomaticPublishing=false
signAllPublications=true

POM_DESCRIPTION=Jetpack Compose for console UI

POM_URL=https://github.com/FoedusProgramme/mosaic/
POM_SCM_URL=https://github.com/FoedusProgramme/mosaic/
POM_SCM_CONNECTION=scm:git:https://github.com/FoedusProgramme/mosaic.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/FoedusProgramme/mosaic.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=unitedsoftware
POM_DEVELOPER_NAME=United Software
POM_DEVELOPER_URL=https://unitedsoftware.org

kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

systemProp.org.gradle.internal.http.socketTimeout=120000

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Set to true (for example in ~/.gradle/gradle.properties) to only build the JVM and the native
# target of the current machine. Skips cross-compiling, linking, and testing every other target.
mosaic.hostOnly=false
