<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mosaic documentation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="docs/latest/">
<script>
// The release documentation once there is a release, and the snapshot documentation until then.
fetch("docs/" + "0.x/index.html", { method: "HEAD" })
  .then(function (response) { location.replace("docs/" + (response.ok ? "0.x/" : "latest/")) })
  .catch(function () { location.replace("docs/" + "latest/") })
</script>
</head>
<body>
<p>Mosaic documentation: <a href=".x/">latest release</a> · <a href="docs/latest/">snapshot of master</a></p>
</body>
</html>
