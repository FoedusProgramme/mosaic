[versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
binaryCompatibilityValidator = "0.18.2"
# Downloaded by the ZigDownloadTask in build-support and used to build the JNI library.
zig = "0.17.0"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
binaryCompatibilityValidator-gradlePlugin = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

kotlinx-io-core = "org.jetbrains.kotlinx:kotlinx-io-core:0.9.1"
kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0"

androidx-annotation = "androidx.annotation:annotation:1.11.0"
androidx-collection = "androidx.collection:collection:1.7.0"
androidx-compose-runtime = "androidx.compose.runtime:runtime:1.12.1"
androidx-lifecycle-compose = "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"

ktlint-core = "com.pinterest.ktlint:ktlint-cli:1.8.0"
ktlint-composeRules = "io.nlopez.compose.rules:ktlint:0.6.8"

clikt = "com.github.ajalt.clikt:clikt:5.1.0"
codepoints = "de.cketti.unicode:kotlin-codepoints:0.11.0"
finalizationHook = "com.jakewharton.finalization:finalization-hook:0.1.0"
apache-compress = "org.apache.commons:commons-compress:1.28.0"

# Shrinkers which run over the mosaic-tty tests.
proguard = "com.guardsquare:proguard-base:7.10.0"
r8 = "com.android.tools:r8:9.5.28"

junit4 = "junit:junit:4.13.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
mavenPublish = "com.vanniktech.maven.publish:0.37.0"
dokka = "org.jetbrains.dokka:2.2.0"
cite = "com.jakewharton.cite:0.9.0"
poko = "dev.drewhamilton.poko:0.23.2"
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
# Newer versions apply the 'java' plugin which is incompatible with Kotlin multiplatform.
jextract = "de.infolektuell.jextract:1.0.0"
testDistribution = "com.jakewharton.test-distribution:0.4.1"
spotless = "com.diffplug.spotless:8.10.4"
burst = "app.cash.burst:2.14.0"
